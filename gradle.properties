org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# detekt 1.23.8 calls deprecated ReportingExtension.file() — upstream issue, no stable fix yet.
# "summary" collapses per-task repetition into one end-of-build line instead of suppressing entirely.
org.gradle.warning.mode=summary

android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=36,37.0

kotlin.code.style=official
