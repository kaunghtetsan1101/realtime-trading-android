name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: temurin

            - name: Validate Gradle wrapper
              uses: gradle/actions/wrapper-validation@v4

            - name: Make Gradle wrapper executable
              run: chmod +x ./gradlew

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Assemble debug APK
              run: ./gradlew assembleDebug --stacktrace --no-daemon

    test:
        name: Unit Tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: temurin

            - name: Validate Gradle wrapper
              uses: gradle/actions/wrapper-validation@v4

            - name: Make Gradle wrapper executable
              run: chmod +x ./gradlew

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Run unit tests
              run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-reports
                  path: '**/build/reports/tests/'
                  retention-days: 7

    detekt:
        name: Detekt
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: temurin

            - name: Validate Gradle wrapper
              uses: gradle/actions/wrapper-validation@v4

            - name: Make Gradle wrapper executable
              run: chmod +x ./gradlew

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Run detekt
              run: ./gradlew detekt --stacktrace --no-daemon

    spotless:
        name: Spotless
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: temurin

            - name: Validate Gradle wrapper
              uses: gradle/actions/wrapper-validation@v4

            - name: Make Gradle wrapper executable
              run: chmod +x ./gradlew

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Check formatting
              run: ./gradlew spotlessCheck --stacktrace --no-daemon
