[versions]
agp                 = "9.0.0"
kotlin              = "2.3.21"
ksp                 = "2.3.8"

compileSdk          = "37"
minSdk              = "26"
targetSdk           = "37"

# AndroidX Core
coreKtx             = "1.18.0"
lifecycleRuntime    = "2.10.0"
activityCompose     = "1.13.0"

# Compose
composeBom          = "2026.05.01"

# Navigation 3
nav3                          = "1.1.2"
lifecycleViewmodelNav3        = "2.10.0"

# Hilt
hilt                          = "2.59.2"
hiltLifecycleViewmodelCompose = "1.3.0"

# Kotlinx Serialization (for Nav3 route keys)
kotlinxSerialization          = "1.11.0"

# Network
retrofit            = "3.0.0"
okhttp              = "5.3.2"

# Room
room                = "2.8.4"

# Coroutines
coroutines          = "1.11.0"

# Logging
timber              = "5.0.1"

# Debug tools
leakcanary          = "2.14"

# Code quality
detekt              = "1.23.8"
spotless            = "7.0.3"

# Testing
junit               = "4.13.2"
junitExt            = "1.3.0"
espressoCore        = "3.7.0"
turbine             = "1.2.1"
mockk               = "1.14.9"


[libraries]
# JSR-330 (javax.inject) — for @Inject in domain layer without Hilt
javax-inject                   = { group = "javax.inject",              name = "javax.inject",                   version = "1" }

# AndroidX
androidx-core-ktx              = { group = "androidx.core",           name = "core-ktx",                       version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",      name = "lifecycle-runtime-ktx",          version.ref = "lifecycleRuntime" }
androidx-activity-compose      = { group = "androidx.activity",       name = "activity-compose",               version.ref = "activityCompose" }

# Compose BOM + core libraries
compose-bom                    = { group = "androidx.compose",        name = "compose-bom",                    version.ref = "composeBom" }
compose-ui                     = { group = "androidx.compose.ui",     name = "ui" }
compose-ui-graphics            = { group = "androidx.compose.ui",     name = "ui-graphics" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
compose-ui-tooling             = { group = "androidx.compose.ui",     name = "ui-tooling" }
compose-ui-test-manifest       = { group = "androidx.compose.ui",     name = "ui-test-manifest" }
compose-ui-test-junit4         = { group = "androidx.compose.ui",     name = "ui-test-junit4" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation 3
navigation3-runtime            = { group = "androidx.navigation3",    name = "navigation3-runtime",            version.ref = "nav3" }
navigation3-ui                 = { group = "androidx.navigation3",    name = "navigation3-ui",                 version.ref = "nav3" }
lifecycle-viewmodel-nav3       = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }

# Hilt
hilt-android                   = { group = "com.google.dagger",       name = "hilt-android",                   version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger",       name = "hilt-android-compiler",          version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt",         name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleViewmodelCompose" }

# Serialization
kotlinx-serialization-core     = { group = "org.jetbrains.kotlinx",   name = "kotlinx-serialization-core",     version.ref = "kotlinxSerialization" }

# Network
retrofit                       = { group = "com.squareup.retrofit2",  name = "retrofit",                       version.ref = "retrofit" }
retrofit-gson                  = { group = "com.squareup.retrofit2",  name = "converter-gson",                 version.ref = "retrofit" }
okhttp                         = { group = "com.squareup.okhttp3",    name = "okhttp",                         version.ref = "okhttp" }
okhttp-logging                 = { group = "com.squareup.okhttp3",    name = "logging-interceptor",            version.ref = "okhttp" }
okhttp-mockwebserver           = { group = "com.squareup.okhttp3",    name = "mockwebserver",                  version.ref = "okhttp" }

# Room
room-runtime                   = { group = "androidx.room",           name = "room-runtime",                   version.ref = "room" }
room-ktx                       = { group = "androidx.room",           name = "room-ktx",                       version.ref = "room" }
room-compiler                  = { group = "androidx.room",           name = "room-compiler",                  version.ref = "room" }

# Coroutines
coroutines-core                = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-core",        version.ref = "coroutines" }
coroutines-android             = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android",     version.ref = "coroutines" }
coroutines-test                = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-test",        version.ref = "coroutines" }

# Logging
timber                         = { group = "com.jakewharton.timber",  name = "timber",                         version.ref = "timber" }

# Debug tools
leakcanary                     = { group = "com.squareup.leakcanary", name = "leakcanary-android",             version.ref = "leakcanary" }

# Testing
junit                          = { group = "junit",                   name = "junit",                          version.ref = "junit" }
junit-ext                      = { group = "androidx.test.ext",       name = "junit",                          version.ref = "junitExt" }
espresso-core                  = { group = "androidx.test.espresso",  name = "espresso-core",                  version.ref = "espressoCore" }
turbine                        = { group = "app.cash.turbine",        name = "turbine",                        version.ref = "turbine" }
mockk                          = { group = "io.mockk",                name = "mockk",                          version.ref = "mockk" }
mockk-android                  = { group = "io.mockk",                name = "mockk-android",                  version.ref = "mockk" }


[plugins]
android-application  = { id = "com.android.application",        version.ref = "agp" }
android-library      = { id = "com.android.library",            version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",       version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",  version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",         version.ref = "ksp" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt               = { id = "io.gitlab.arturbosch.detekt",     version.ref = "detekt" }
spotless             = { id = "com.diffplug.spotless",           version.ref = "spotless" }
