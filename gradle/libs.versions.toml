[versions]
agp                 = "9.2.1"
benchmarkMacroJunit4 = "1.5.0-alpha06"
junit = "1.3.0"
kotlin              = "2.4.0"
ksp                 = "2.3.4"

compileSdk          = "36"
minSdk              = "26"
targetSdk           = "36"

# AndroidX Core
coreKtx             = "1.15.0"
lifecycleRuntime    = "2.10.0"
activityCompose     = "1.9.3"

# Compose
composeBom          = "2025.09.01"

# Navigation 3
nav3                          = "1.0.0"
lifecycleViewmodelNav3        = "2.10.0"

# Hilt
hilt                          = "2.59"
hiltLifecycleViewmodelCompose = "1.3.0-alpha02"

# Kotlinx Serialization (for Nav3 route keys)
kotlinxSerialization          = "1.8.0"

# Network
retrofit            = "2.11.0"
okhttp              = "4.12.0"

# Room
androidxRoom          = "2.8.3"

# Coroutines
kotlinxCoroutines     = "1.10.1"

# Logging
timber              = "5.0.1"

# Debug tools
leakcanary          = "2.14"

# Baseline Profiles + Macrobenchmark
androidxMacroBenchmark = "1.5.0-alpha01"
profileinstaller    = "1.4.1"
uiautomator         = "2.3.0"

# Code quality
detekt              = "1.23.8"
spotless            = "7.0.3"

# Testing
junitVersion          = "4.13.2"
junitExt            = "1.3.0-rc01"
espressoCore        = "3.6.1"
turbineVersion      = "1.2.0"
mockk               = "1.14.0"


[libraries]
# Build-logic classpath (used in build-logic/convention/build.gradle.kts)
android-gradle-plugin          = { group = "com.android.tools.build",   name = "gradle",                         version.ref = "agp" }
androidx-benchmark-macro-junit4-v150alpha06 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmarkMacroJunit4" }
androidx-junit-v130 = { module = "androidx.test.ext:junit", version.ref = "junit" }
kotlin-gradle-plugin           = { group = "org.jetbrains.kotlin",      name = "kotlin-gradle-plugin",           version.ref = "kotlin" }

# JSR-330 (javax.inject) — for @Inject in domain layer without Hilt
javax-inject                   = { group = "javax.inject",              name = "javax.inject",                   version = "1" }

# AndroidX
androidx-core-ktx              = { group = "androidx.core",           name = "core-ktx",                       version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle",      name = "lifecycle-runtime-ktx",          version.ref = "lifecycleRuntime" }
androidx-activity-compose      = { group = "androidx.activity",       name = "activity-compose",               version.ref = "activityCompose" }

# Compose BOM + core libraries
compose-bom                    = { group = "androidx.compose",        name = "compose-bom",                    version.ref = "composeBom" }
compose-ui                     = { group = "androidx.compose.ui",     name = "ui" }
compose-ui-graphics            = { group = "androidx.compose.ui",     name = "ui-graphics" }
compose-ui-tooling-preview     = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
compose-ui-tooling             = { group = "androidx.compose.ui",     name = "ui-tooling" }
compose-ui-test-manifest       = { group = "androidx.compose.ui",     name = "ui-test-manifest" }
compose-ui-test-junit4         = { group = "androidx.compose.ui",     name = "ui-test-junit4" }
compose-material3              = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation 3
navigation3-runtime            = { group = "androidx.navigation3",    name = "navigation3-runtime",            version.ref = "nav3" }
navigation3-ui                 = { group = "androidx.navigation3",    name = "navigation3-ui",                 version.ref = "nav3" }
lifecycle-viewmodel-nav3       = { group = "androidx.lifecycle",      name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }

# Hilt
hilt-android                   = { group = "com.google.dagger",       name = "hilt-android",                   version.ref = "hilt" }
hilt-compiler                  = { group = "com.google.dagger",       name = "hilt-android-compiler",          version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt",         name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleViewmodelCompose" }

# Serialization
kotlinx-serialization-core     = { group = "org.jetbrains.kotlinx",   name = "kotlinx-serialization-core",     version.ref = "kotlinxSerialization" }

# Network
retrofit                       = { group = "com.squareup.retrofit2",  name = "retrofit",                       version.ref = "retrofit" }
retrofit-gson                  = { group = "com.squareup.retrofit2",  name = "converter-gson",                 version.ref = "retrofit" }
okhttp                         = { group = "com.squareup.okhttp3",    name = "okhttp",                         version.ref = "okhttp" }
okhttp-logging                 = { group = "com.squareup.okhttp3",    name = "logging-interceptor",            version.ref = "okhttp" }
okhttp-mockwebserver           = { group = "com.squareup.okhttp3",    name = "mockwebserver",                  version.ref = "okhttp" }

# Room
room-runtime                   = { group = "androidx.room",           name = "room-runtime",                   version.ref = "androidxRoom" }
room-ktx                       = { group = "androidx.room",           name = "room-ktx",                       version.ref = "androidxRoom" }
room-compiler                  = { group = "androidx.room",           name = "room-compiler",                  version.ref = "androidxRoom" }

# Coroutines
coroutines-core                = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-core",        version.ref = "kotlinxCoroutines" }
coroutines-android             = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-android",     version.ref = "kotlinxCoroutines" }
coroutines-test                = { group = "org.jetbrains.kotlinx",   name = "kotlinx-coroutines-test",        version.ref = "kotlinxCoroutines" }

# Logging
timber                         = { group = "com.jakewharton.timber",  name = "timber",                         version.ref = "timber" }

# Debug tools
leakcanary                     = { group = "com.squareup.leakcanary", name = "leakcanary-android",             version.ref = "leakcanary" }

# Baseline Profiles + Macrobenchmark
benchmark-macro-junit4         = { group = "androidx.benchmark",       name = "benchmark-macro-junit4",         version.ref = "androidxMacroBenchmark" }
profileinstaller               = { group = "androidx.profileinstaller", name = "profileinstaller",               version.ref = "profileinstaller" }
uiautomator                    = { group = "androidx.test.uiautomator", name = "uiautomator",                    version.ref = "uiautomator" }

# Testing
junit4                         = { group = "junit",                   name = "junit",                          version.ref = "junitVersion" }
junit-ext                      = { group = "androidx.test.ext",       name = "junit",                          version.ref = "junitExt" }
espresso-core                  = { group = "androidx.test.espresso",  name = "espresso-core",                  version.ref = "espressoCore" }
turbine                        = { group = "app.cash.turbine",        name = "turbine",                        version.ref = "turbineVersion" }
mockk                          = { group = "io.mockk",                name = "mockk",                          version.ref = "mockk" }
mockk-android                  = { group = "io.mockk",                name = "mockk-android",                  version.ref = "mockk" }


[plugins]
android-application  = { id = "com.android.application",        version.ref = "agp" }
android-library      = { id = "com.android.library",            version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",       version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",  version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",         version.ref = "ksp" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt               = { id = "io.gitlab.arturbosch.detekt",     version.ref = "detekt" }
spotless             = { id = "com.diffplug.spotless",           version.ref = "spotless" }
android-test                   = { id = "com.android.test",                         version.ref = "agp" }
baselineprofile                = { id = "androidx.baselineprofile",                  version.ref = "androidxMacroBenchmark" }
# Convention plugins from build-logic composite build — version ignored at resolution time
tradingapp-kotlin-library          = { id = "tradingapp.kotlin.library",          version = "unspecified" }
tradingapp-android-library         = { id = "tradingapp.android.library",         version = "unspecified" }
tradingapp-android-library-compose = { id = "tradingapp.android.library.compose", version = "unspecified" }
tradingapp-android-hilt            = { id = "tradingapp.android.hilt",            version = "unspecified" }
tradingapp-android-feature         = { id = "tradingapp.android.feature",         version = "unspecified" }
tradingapp-android-application     = { id = "tradingapp.android.application",     version = "unspecified" }
